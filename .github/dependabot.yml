# Dependabot — PGC seção 13 (dependências de terceiros como itens de configuração)
# Abre PRs de atualização que passam pelo mesmo CI e revisão dos demais.
# O prefixo "chore(deps)" faz o título passar no check de Conventional Commits
# e não gera versão nova sozinho.

version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'

  # As próprias actions usadas nos workflows também são dependências.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
